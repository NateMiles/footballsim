[package]
name = "fs-wasm"
description = "The fs-api session for the browser: a wasm-bindgen wrapper run inside a web worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fs-api.workspace = true
wasm-bindgen.workspace = true

# Not the workspace lints: wasm-bindgen's generated glue needs `unsafe`,
# which the workspace forbids. This crate itself writes none.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
