[package]
name = "footballsim-app"
description = "The native shell: the web UI in the system web view, the simulation core in-process."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Its own workspace: Tauri needs platform web views (WebKit on macOS and
# iOS), which the simulation workspace and its CI do not.
[workspace]

[lib]
name = "footballsim_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs-api = { path = "../../crates/fs-api" }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"

# The simulation is slow unoptimised; keep `tauri dev` builds playable.
[profile.dev.package."*"]
opt-level = 3
