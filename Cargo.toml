[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri shell builds on macOS (and Linux with WebKitGTK) only, so it
# is its own workspace; see app/src-tauri.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
fs-core = { path = "crates/fs-core" }
fs-world = { path = "crates/fs-world" }
fs-gen = { path = "crates/fs-gen" }
fs-match = { path = "crates/fs-match" }
fs-lab = { path = "crates/fs-lab" }
fs-api = { path = "crates/fs-api" }
fs-save = { path = "crates/fs-save" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libm = "0.2"
rayon = "1"
thiserror = "2"
serde_json = "1"
ts-rs = "12"
base64 = "0.22"
miniz_oxide = "0.8"
wasm-bindgen = "=0.2.129"
serde-big-array = "0.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "warn"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"

# The simulation is slow unoptimised; keep debug builds and tests quick.
[profile.dev.package.fs-match]
opt-level = 3
[profile.dev.package.fs-core]
opt-level = 3
[profile.dev.package.fs-world]
opt-level = 3

# The browser build: small and fast, no debug info.
[profile.wasm]
inherits = "release"
debug = false
strip = true
